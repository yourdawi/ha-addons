name: Bambu Lab Filament Watcher
version: "1.0.1"
slug: bfw
description: Tracks Bambu Lab filament stock with a web interface and optional MQTT publishing.
author: Dawi
url: https://github.com/yourdawi/bambulab-filament-watcher
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:printer-3d-nozzle
panel_title: Filament Watcher
options:
  publish_mode: none
  mqtt_broker: homeassistant.local
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  check_interval: 300
  publish_on_change_only: true
  web_enabled: true
  web_port: 8099
  filaments: []
schema:
  publish_mode: list(mqtt|none)
  mqtt_broker: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
  check_interval: int(60,3600)
  publish_on_change_only: bool
  web_enabled: bool
  web_port: port
  filaments:
    - name: str
      url: url
      variant_id: int
      swatch_image: str?
